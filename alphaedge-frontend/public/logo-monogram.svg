<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="36" fill="#0F172A"/>
  <!-- SA Monogram -->
  <g transform="translate(25, 20)">
    <!-- S Monogram Letter in Navy/White contrast -->
    <path d="M75,35 C60,25 40,30 35,45 C30,60 50,70 65,78 C85,88 90,105 82,122 C72,140 45,145 25,130 C18,125 12,118 10,110" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
