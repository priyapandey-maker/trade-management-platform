<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHREE ASSOCIATES Alerts</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #F8FAFC;
      padding: 40px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .header {
      background-color: #0F172A;
      padding: 24px;
      text-align: center;
      border-bottom: 2px solid #16A34A;
    }
    .logo {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .content {
      padding: 32px 24px;
    }
    .footer {
      background-color: #F1F5F9;
      padding: 20px;
      text-align: center;
      font-size: 11.5px;
      color: #64748B;
      border-top: 1px solid #E2E8F0;
    }
    .footer a {
      color: #16A34A;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1 class="logo">SHREE ASSOCIATES</h1>
      </div>
      <div class="content">
        {{CONTENT}}
      </div>
      <div class="footer">
        <p>© 2026 SHREE ASSOCIATES. All institutional rights reserved.</p>
        <p>This is an automated trade engine notification. <a href="http://localhost:3000">Access Platform Terminal</a></p>
      </div>
    </div>
  </div>
</body>
</html>
