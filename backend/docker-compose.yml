version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alphaedge_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: alphaedge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: alphaedge_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: alphaedge_redis_insight
    restart: always
    ports:
      - '8001:5540'
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
