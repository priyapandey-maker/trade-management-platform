services:
  - type: web
    name: trade-management-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
